<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no">
	<meta name="theme-color" content="#1d1c18">
	<meta name="description" content="A quiet place to read scripture and study it by marking with intention.">

	<!-- PWA / home-screen app -->
	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">
	<link rel="icon" href="%PUBLIC_URL%/favicon-64.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Scribal">
	<meta name="mobile-web-app-capable" content="yes">

	<title>Scribal</title>
	<style>
		html, body { margin: 0; padding: 0; }
	</style>
	<script>
		// Paint the launch background in the LAST-USED theme color (warm / light /
		// dark) BEFORE React mounts, so tapping the app doesn't flash a dark
		// screen when the user is on a light or warm theme. `scribal_bg` is
		// written by the app whenever its background changes; fall back to the
		// saved dark/light choice, then the OS preference.
		//
		// Set it on BOTH <html> and <body>: the body fills the area behind the
		// safe-area insets (the strip under the iOS home indicator), so leaving
		// it a different color paints a stray bar there.
		(function () {
			try {
				var bg = localStorage.getItem("scribal_bg");
				if (!bg) {
					var t = localStorage.getItem("scribal_theme");
					var prefersDark = window.matchMedia &&
						window.matchMedia("(prefers-color-scheme: dark)").matches;
					bg = t === "dark" ? "#131210" : t === "light" ? "#f6f4ee" : (prefersDark ? "#131210" : "#f6f4ee");
				}
				document.documentElement.style.backgroundColor = bg;
				var setBody = function () {
					if (document.body) document.body.style.backgroundColor = bg;
				};
				setBody();
				document.addEventListener("DOMContentLoaded", setBody);
				var m = document.querySelector('meta[name="theme-color"]');
				if (m) m.setAttribute("content", bg);
			} catch (e) {}
		})();
	</script>
</head>

<body>
	<noscript>
		You need to enable JavaScript to run this app.
	</noscript>
	<div id="root"></div>
</body>

</html>
