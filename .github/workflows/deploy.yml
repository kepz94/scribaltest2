name: Deploy to GitHub Pages

# Builds the Create React App in scribaltest1-main/ and publishes it to GitHub
# Pages. Runs on every push to main, and can be triggered manually from the
# Actions tab. The site is served at https://<owner>.github.io/scribaltest2/
# (the repo subpath), which is why package.json sets "homepage": "/scribaltest2".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scribaltest1-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scribaltest1-main/package-lock.json

      # Turns on GitHub Pages (Actions source) for the repo if it isn't already,
      # so the deploy works without anyone flipping a setting by hand.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The lexical packages have peer-dependency conflicts that strict npm ci
      # rejects, so install with --legacy-peer-deps (matches how the lockfile
      # resolves).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # CI=false so lint warnings don't fail the production build. The base path
      # comes from the "homepage" field, baked in at build time.
      - name: Build
        run: CI=false npm run build

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so give it
      # the app shell (deep links / refreshes still boot the app).
      - name: Add SPA 404 fallback
        run: cp build/index.html build/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: scribaltest1-main/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
